workflows:
  ios-appstore:
    name: Salty St Kitts — iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: SaltyAppStoreKey
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.saltystkitts.guide
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.saltystkitts.guide"
      node: 20.11.1
      xcode: 26.6
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Pack offline content and photos
        script: node script/snapshot.mjs

      - name: Build the web app
        script: npm run build

      - name: Sync web assets into the iOS project
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))

      - name: Apply signing profiles
        script: xcode-project use-profiles

      - name: Build the IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - saltystkitts@gmail.com
        notify:
          success: true
          failure: true

  android-play:
    name: Salty St Kitts — Android Google Play
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      groups:
        - android_signing
      node: 20.11.1
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Pack offline content and photos
        script: node script/snapshot.mjs
      - name: Build the web app
        script: npm run build
      - name: Sync web assets into the Android project
        script: npx cap sync android
      - name: Set up signing key
        script: |
          echo $CM_KEYSTORE_B64 | base64 --decode > /tmp/salty-upload.jks
          echo "CM_KEYSTORE_PATH=/tmp/salty-upload.jks" >> $CM_ENV
      - name: Build the app bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
